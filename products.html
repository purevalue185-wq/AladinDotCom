<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Products | AladinDotCom
  </title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="container nav-container">

      <a href="index.html" class="logo">
        Aladin<span>DotCom</span>
      </a>

      <button class="hamburger" id="hamburgerBtn">

        <i class="fas fa-bars"></i>

      </button>

      <div class="nav-links" id="navLinks">

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="index.html#contact">Contact</a>

        <!-- SEARCH -->
        <div class="search-bar">

          <input
            type="text"
            placeholder="Search wholesale products..."
            id="productSearchInput"
          >

          <button id="productSearchBtn">

            <i class="fas fa-search"></i>

          </button>

        </div>

      </div>

    </div>

  </nav>


  <!-- HEADER -->
  <section class="hero">

    <div class="container">

      <div class="section-title">

        <h2 id="pageTitle">

          All Products

        </h2>

        <p id="pageSubtitle">

          Browse wholesale import products

        </p>

      </div>

      <!-- FILTERS -->
      <div class="hero-tags">

        <button
          class="btn btn-outline filter-btn active"
          data-category="all"
        >

          All

        </button>

        <button
          class="btn btn-outline filter-btn"
          data-category="electronics"
        >

          Electronics

        </button>

        <button
          class="btn btn-outline filter-btn"
          data-category="kitchen"
        >

          Kitchen

        </button>

        <button
          class="btn btn-outline filter-btn"
          data-category="beauty"
        >

          Beauty

        </button>

        <button
          class="btn btn-outline filter-btn"
          data-category="household"
        >

          Household

        </button>

      </div>

      <!-- RESULT -->
      <div
        id="resultCount"
        style="
          margin-top:1rem;
          font-weight:700;
        "
      >

        Showing 0 Products

      </div>

    </div>

  </section>


  <!-- PRODUCTS -->
  <section class="container section-padding">

    <div
      class="products-grid"
      id="allProductsContainer"
    ></div>

  </section>


  <!-- FOOTER -->
  <footer>

    <div class="container footer-container">

      <div>

        <strong>

          AladinDotCom

        </strong>

      </div>

      <div class="footer-links">

        <a href="index.html">

          Home

        </a>

        <a href="products.html">

          Products

        </a>

      </div>

    </div>

    <div class="container copyright">

      <p>

        © 2026 AladinDotCom

      </p>

    </div>

  </footer>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script src="firebase-config.js"></script>

  <script src="data.js"></script>

  <script src="products.js"></script>

</body>

</html>
